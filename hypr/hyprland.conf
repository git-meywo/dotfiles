################
### MONITORS ###
################



###################
### MY PROGRAMS ###
###################

$terminal = ghostty

$bar = waybar
$menu = wofi --show drun
$notification = dunst

$wallpaper = hyprpaper

$lockscreen = hyprlock

#################
### AUTOSTART ###
#################

# exec-once = $bar
exec-once = $notification
# exec-once = $wallpaper

exec-once = systemctl --user start hyprpolkitagent

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE, 24
env = HYPRCURSOR_SIZE, 24
env = LIBVA_DRIVER_NAME, nvidia
env = __GLX_VENDOR_LIBRARY_NAME, nvidia
env = ELECTRON_OZONE_PLATFORM_HINT, auto
env = NVD_BACKEND, direct

#####################
### LOOK AND FEEL ###
#####################

general {

    gaps_in = 5
    gaps_out = 10

    border_size = 2

    col.active_border = rgb(002f6c) rgb(008ad8) 45deg
    col.inactive_border = rgb(4c4e52)

    resize_on_border = false

    allow_tearing = false

    layout = master
}

decoration {

    rounding = 8
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {

        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {

    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1.0
    bezier = quick, 0.15, 0, 0.1, 1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

master {

    mfact = 0.5
    new_status = slave
}

misc {

    force_default_wallpaper = 0
    disable_hyprland_logo = false
}

#############
### INPUT ###
#############

input {

    kb_layout = fr
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    numlock_by_default = true

    follow_mouse = 1
    sensitivity = -0.8

    touchpad {

        natural_scroll = false
    }
}

gestures {

    workspace_swipe = false
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# Misc. Keybindings
bind = $mainMod, A, exec, $terminal
bind = $mainMod, E, killactive,
bind = $mainMod, R, exec, $menu
bind = $mainMod, F, fullscreen,
bind = $mainMod, V, togglefloating,
bind = $mainMod, S, layoutmsg, swapwithmaster
bind = $mainMod, Q, layoutmsg, addmaster
bind = $mainMod, D, layoutmsg, removemaster
bind = $mainMod, M, exit,

# Move Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move to Workspace
bind = $mainMod, ampersand, workspace, 1
bind = $mainMod, eacute, workspace, 2
bind = $mainMod, quotedbl, workspace, 3
bind = $mainMod, apostrophe, workspace, 4
bind = $mainMod, parenleft, workspace, 5
bind = $mainMod, egrave, workspace, 6
bind = $mainMod, minus, workspace, 7
bind = $mainMod, underscore, workspace, 8
bind = $mainMod, ccedilla, workspace, 9
bind = $mainMod, agrave, workspace, 10

# Send to Workspace
bind = SHIFT $mainMod, ampersand, movetoworkspace, 1
bind = SHIFT $mainMod, eacute, movetoworkspace, 2
bind = SHIFT $mainMod, quotedbl, movetoworkspace, 3
bind = SHIFT $mainMod, apostrophe, movetoworkspace, 4
bind = SHIFT $mainMod, parenleft, movetoworkspace, 5
bind = SHIFT $mainMod, egrave, movetoworkspace, 6
bind = SHIFT $mainMod, minus, movetoworkspace, 7
bind = SHIFT $mainMod, underscore, movetoworkspace, 8
bind = SHIFT $mainMod, ccedilla, movetoworkspace, 9
bind = SHIFT $mainMod, agrave, movetoworkspace, 10

# Move/Resize Windows
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule = suppressevent maximize, class:.*

windowrule = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0
